<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- Disable browser progress indicators -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fafafa">
  <meta name="msapplication-navbutton-color" content="#fafafa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="fusion_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bose Professional - Fusion Web</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333;">
    <div style="text-align: center;">
      <!-- Bose Professional Logo -->
      <img src="assets/images/bose_professional_logo.png" alt="Bose Professional" style="height: 50px; margin-bottom: 32px;" />
      
      <!-- LinkedIn-style bar loader -->
      <div style="width: 200px; height: 4px; background-color: #f0f0f0; border-radius: 2px; margin: 0 auto; overflow: hidden;">
        <div style="width: 100%; height: 100%; background-color: #333; border-radius: 2px; animation: loadingBar 2s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>
  
  <style>
    @keyframes loadingBar {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
  
  <!-- Auth0 SPA SDK -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
