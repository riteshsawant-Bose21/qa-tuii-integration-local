language: "flutter"

tasks:
  build:
    deps: ["build-apk", "build-iOS"]

  build-apk:
    command: "flutter"
    args: ["build", "apk"]
    options:
      cache: true

  build-iOS:
    command: "flutter"
    args: ["build", "ipa", "--export-options-plist=./iOS/AS-info.plist"]
    options:
      cache: true
