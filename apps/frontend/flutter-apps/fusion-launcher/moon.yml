project:
  name: "fusion-launcher"
  description: "Fusion launcher"

tasks:
  analyze:
    command: "flutter"
    args: ["analyze", "--fatal-warnings", "--fatal-infos"]
    options:
      cache: false

  build-apk:
    command: "flutter"
    args: ["build", "apk"]
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-ios:
    command: "flutter"
    args: ["build", "ipa"]
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-macos:
    command: "flutter"
    args: ["build", "macos"]
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-macos-automation:
    command: "flutter"
    args: ["build", "macos", "--profile", './integration_test/appium.dart']
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-windows:
    command: "flutter"
    args: ["build", "windows"]
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-windows-automation:
    command: "flutter"
    args: ["build", "windows", "--profile", '.\integration_test\appium.dart']
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

  build-web:
    command: "flutter"
    args: ["build", "web"]
    deps:
#      - "analyze"
#      - "unit-tests"
    options:
      cache: false

#  unit-tests:
#    command: "flutter"
#    args: ["test"]
#    options:
#      cache: false

  format:
    command: "dart"
    args: ["format", "."]
    options:
      cache: false

