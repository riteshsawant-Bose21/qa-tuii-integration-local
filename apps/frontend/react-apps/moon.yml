project:
  name: "react-apps"
  description: "React applications workspace"

tasks:
  # Individual app development tasks
  start-landing-page:
    command: "cd landing-page && yarn dev"
    deps:
      - "install-landing-page"

  start-web-dashboard:
    command: "cd web-dashboard && yarn dev"
    deps:
      - "install-web-dashboard"

  # Install dependencies
  install-landing-page:
    command: "cd landing-page && yarn install"
    inputs:
      - "landing-page/package.json"
      - "landing-page/yarn.lock"

  install-web-dashboard:
    command: "cd web-dashboard && yarn install"
    inputs:
      - "web-dashboard/package.json"
      - "web-dashboard/yarn.lock"

  # Install all
  install-all:
    deps:
      - "install-landing-page"
      - "install-web-dashboard"

  # Setup task to ensure everything is ready
  setup:
    deps:
      - "install-all"

  # Individual app linting
  lint-landing-page:
    command: "cd landing-page && yarn lint"
    deps:
      - "install-landing-page"

  lint-web-dashboard:
    command: "cd web-dashboard && yarn lint"
    deps:
      - "install-web-dashboard"

  # Batch linting
  lint-all:
    deps:
      - "lint-landing-page"
      - "lint-web-dashboard"

  # Individual app formatting
  format-landing-page:
    command: "cd landing-page && yarn format"
    deps:
      - "install-landing-page"
    args:
      - "--ignore-path"
      - ".prettierignore"

  format-web-dashboard:
    command: "cd web-dashboard && yarn format"
    deps:
      - "install-web-dashboard"
    args:
      - "--ignore-path"
      - ".prettierignore"

  # Batch formatting
  format-all:
    deps:
      - "format-landing-page"
      - "format-web-dashboard"

  # Individual app formatting check
  format-check-landing-page:
    command: "cd landing-page && yarn format-check"
    deps:
      - "install-landing-page"
    args:
      - "--check"
      - "--ignore-path"
      - ".prettierignore"

  format-check-web-dashboard:
    command: "cd web-dashboard && yarn format-check"
    deps:
      - "install-web-dashboard"
    args:
      - "--check"
      - "--ignore-path"
      - ".prettierignore"

  # Batch formatting check
  format-check-all:
    deps:
      - "format-check-landing-page"
      - "format-check-web-dashboard"

  # Validate lint and format
  validate-all:
    deps:
      - "lint-all"
      - "format-check-all"

  # Individual app build tasks
  build-landing-page:
    command: "cd landing-page && yarn build"
    deps:
      - "install-landing-page"

  build-web-dashboard:
    command: "cd web-dashboard && yarn build"
    deps:
      - "install-web-dashboard"

  # Batch build
  build-all:
    deps:
      - "validate-all"
      - "build-landing-page"
      - "build-web-dashboard"
