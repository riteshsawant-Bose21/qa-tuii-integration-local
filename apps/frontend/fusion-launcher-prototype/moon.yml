language: "flutter"

tasks:
  build-apk:
    command: "flutter"
    args: ["build", "apk"]
    options:
      cache: true

  build-iOS:
    command: "flutter"
    args: ["build", "ipa", "--export-options-plist=./iOS/AS-info.plist"]
    options:
      cache: true

  unit-test:
    command: "flutter"
    args: ["test"]

  format:
    command: "flutter"
    args: ["format", "."]
