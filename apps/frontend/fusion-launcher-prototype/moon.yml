language: "flutter"

tasks:
  build-apk:
    command: "flutter"
    args: ["build", "apk"]
    options:
      cache: true

  build-iOS:
    command: "flutter"
    args: ["build", "ipa"]
    options:
      cache: true

  test:
    command: "flutter"
    args: ["test"]

  analyze:
    command: "flutter"
    args: ["analyze"]

  format:
    command: "flutter"
    args: ["format", "."]
