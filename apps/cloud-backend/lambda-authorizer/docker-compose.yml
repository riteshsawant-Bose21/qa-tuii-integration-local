version: '3.8'

services:
  lambda-authorizer:
    build: .
    ports:
      - "9000:8080"  # Lambda Runtime Interface Emulator listens on 8080
    environment:
      # IMPORTANT: Set your actual Auth0 domain here!
      # Get this from your Auth0 dashboard (e.g., your-tenant.auth0.com or your-tenant.us.auth0.com)
      - AUTH0_DOMAIN=id-dev.boseprofessional.com
      - DB_HOST='host.docker.internal'  # Use host.docker.internal to connect to the host machine's database
      - DB_PORT=5432
      - DB_USER='fusion_cloud'
      - DB_PASS='bose123'
      - DB_NAME='fusion_cloud'
      - DB_SSLMODE='disable'
    networks:
      - lambda-network

networks:
  lambda-network:
    driver: bridge