version: "2"

run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: internal/fusion/product/validation/field_validator\.go
        linters:
          - staticcheck
        text: QF1012
      - path: internal/environment/constants\.go
        linters:
          - gosec
        text: G101