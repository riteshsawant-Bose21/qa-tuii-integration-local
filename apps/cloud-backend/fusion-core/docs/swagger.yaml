host: localhost:8020
info:
  contact: {}
  description: This is the Fusion Cloud Backend API server.
  title: Fusion Cloud Backend API
  version: "1.0"
paths:
  /products:
    get:
      consumes:
      - application/json
      description: Get all available products including speakers, amplifiers and digital
        signal processors
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with all products
          schema:
            $ref: '#/definitions/fusion.ProductResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all products
      tags:
      - products
  /products/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific product by its unique identifier
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with product details
          schema:
            $ref: '#/definitions/fusion.ProductResponse'
        "400":
          description: Bad request - Product ID is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product by ID
      tags:
      - products
  /projects:
    get:
      consumes:
      - application/json
      description: Get all projects in the system
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all projects
          schema:
            items:
              $ref: '#/definitions/fusion.Project'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project in the system
      parameters:
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/fusion.Project'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created project
          schema:
            $ref: '#/definitions/fusion.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new project
      tags:
      - projects
  /projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted project
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get a specific project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved project
          schema:
            $ref: '#/definitions/fusion.Project'
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project by ID
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update an existing project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/fusion.Project'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated project
          schema:
            $ref: '#/definitions/fusion.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update project
      tags:
      - projects
  /projects/{id}/sync:
    post:
      consumes:
      - application/json
      description: Synchronize project data with external source using metadata and
        ZIP file URL
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Sync request containing metadata and ZIP file URL
        in: body
        name: syncRequest
        required: true
        schema:
          $ref: '#/definitions/handler.SyncProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated project sync
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sync project
      tags:
      - projects
schemes:
- http
- https
swagger: "2.0"
