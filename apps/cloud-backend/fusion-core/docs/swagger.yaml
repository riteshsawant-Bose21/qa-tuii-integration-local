basePath: /api/v1
definitions:
  types.AccessLevel:
    properties:
      id:
        type: integer
      key:
        type: string
      label:
        type: string
    type: object
  types.AccountInfo:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  types.Amplifier:
    properties:
      category:
        type: string
      id:
        type: integer
      meta_info:
        $ref: '#/definitions/types.Amplifier_meta_response'
    type: object
  types.Amplifier_meta_response:
    properties:
      channels:
        type: integer
      image_url:
        items:
          type: string
        type: array
      name:
        type: string
      power_output:
        $ref: '#/definitions/types.powerOutput'
      total_capacity:
        type: number
    type: object
  types.AssignRoleRequest:
    properties:
      role_id:
        type: integer
      user_id:
        type: integer
    required:
    - role_id
    - user_id
    type: object
  types.Budget:
    properties:
      amount:
        type: number
      currency:
        type: string
    type: object
  types.CreateRoleRequest:
    properties:
      description:
        maxLength: 255
        minLength: 10
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - description
    - name
    type: object
  types.CreateUserRequest:
    properties:
      account_id:
        type: string
      account_type_role_id:
        type: integer
      email:
        type: string
      full_name:
        type: string
    required:
    - account_id
    - account_type_role_id
    - email
    - full_name
    type: object
  types.DSP_meta:
    properties:
      acoustic_echo_cancellation:
        properties:
          channels:
            type: integer
        type: object
      configuration_software:
        type: string
      dimensions:
        properties:
          rack_space:
            type: string
          size:
            items:
              properties:
                depth:
                  type: integer
                height:
                  type: integer
                unit:
                  type: string
                width:
                  type: integer
              type: object
            type: array
        type: object
      dsp_architecture:
        type: string
      firmware:
        properties:
          current_published_version:
            type: string
          current_running_version:
            type: string
        type: object
      gpio_logic_ports:
        properties:
          inputs:
            type: integer
          outputs:
            type: integer
        type: object
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      max_number_of_analog_control:
        type: integer
      max_number_of_digital_control:
        type: integer
      model:
        type: string
      name:
        type: string
      net_weight:
        items:
          properties:
            unit:
              type: string
            value:
              type: string
          type: object
        type: array
      number_of_inputs_and_outputs:
        properties:
          aes67:
            properties:
              max_inputs:
                type: integer
              max_outputs:
                type: integer
            type: object
          dante:
            properties:
              max_inputs:
                type: integer
              max_outputs:
                type: integer
            type: object
          fusion_connect:
            properties:
              max_inputs:
                type: integer
              max_outputs:
                type: integer
            type: object
        type: object
      product_codes:
        items:
          type: string
        type: array
      safe_operating_temperature:
        properties:
          max:
            type: integer
          min:
            type: integer
          unit:
            type: string
        type: object
      skus:
        items:
          type: integer
        type: array
      supported_bose_professional_dante_endpoints:
        items:
          type: string
        type: array
    type: object
  types.DigitalSignalProcessor:
    properties:
      category:
        type: string
      id:
        type: integer
      meta_info:
        $ref: '#/definitions/types.DSP_meta'
    type: object
  types.Feature:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  types.FeaturePermissionDetail:
    properties:
      access_label:
        type: string
      access_level:
        type: string
      access_level_id:
        type: integer
      feature_id:
        type: integer
      feature_name:
        type: string
    type: object
  types.OrganizationUsersResponse:
    properties:
      account:
        $ref: '#/definitions/types.AccountInfo'
      users:
        items:
          $ref: '#/definitions/types.UserWithRole'
        type: array
    type: object
  types.PermissionUpdateRequest:
    properties:
      access_level_id:
        type: integer
      action:
        enum:
        - add
        - update
        - remove
        type: string
      feature_id:
        type: integer
    required:
    - access_level_id
    - action
    - feature_id
    type: object
  types.ProductResponse:
    properties:
      amplifier:
        items:
          $ref: '#/definitions/types.Amplifier'
        type: array
      digital_signal_processors:
        items:
          $ref: '#/definitions/types.DigitalSignalProcessor'
        type: array
      speaker:
        items:
          $ref: '#/definitions/types.Speaker'
        type: array
    type: object
  types.Project:
    properties:
      application:
        type: string
      budget:
        $ref: '#/definitions/types.Budget'
      description:
        type: string
      id:
        type: string
      meta_data:
        additionalProperties: true
        type: object
      name:
        type: string
      organization_id:
        type: string
      project_file_url:
        type: string
      venue:
        type: string
      venue_type:
        type: string
    type: object
  types.RoleInfo:
    properties:
      id:
        type: integer
      role_name:
        type: string
    type: object
  types.RoleManagementResponse:
    properties:
      access_levels:
        items:
          $ref: '#/definitions/types.AccessLevel'
        type: array
      features:
        items:
          $ref: '#/definitions/types.Feature'
        type: array
      roles:
        items:
          $ref: '#/definitions/types.RoleWithPermissions'
        type: array
      users:
        items:
          $ref: '#/definitions/types.UserBasicInfo'
        type: array
    type: object
  types.RoleWithPermissions:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/types.FeaturePermissionDetail'
        type: array
      user_count:
        type: integer
    type: object
  types.Speaker:
    properties:
      category:
        type: string
      id:
        type: integer
      meta_info:
        $ref: '#/definitions/types.Speaker_meta_response'
    type: object
  types.Speaker_meta_response:
    properties:
      available_taps:
        properties:
          70v:
            items:
              type: number
            type: array
          100v:
            items:
              type: number
            type: array
        type: object
      environment:
        type: string
      image_url:
        items:
          type: string
        type: array
      is_subwoofer:
        type: boolean
      max_spl:
        type: number
      model:
        type: string
      mount_type:
        type: string
      nominal_impedance:
        $ref: '#/definitions/types.nominal_impedence'
      power_handling:
        properties:
          long_term_continuous:
            type: string
          peak:
            type: string
          unit:
            type: string
        type: object
      sensitivity:
        properties:
          at:
            items:
              properties:
                key:
                  type: string
                value:
                  type: string
              type: object
            type: array
          unit:
            type: string
        type: object
    type: object
  types.SyncProjectRequest:
    type: object
  types.UpdateUserRequest:
    properties:
      account_id:
        type: string
      account_type_role_id:
        type: integer
      full_name:
        type: string
    type: object
  types.User:
    properties:
      account_id:
        type: string
      account_type_role_id:
        type: integer
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  types.UserAuthorizationResponse:
    properties:
      account:
        $ref: '#/definitions/types.AccountInfo'
      permissions:
        additionalProperties:
          type: string
        type: object
      role:
        $ref: '#/definitions/types.RoleInfo'
      user:
        $ref: '#/definitions/types.UserInfo'
    type: object
  types.UserBasicInfo:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
    type: object
  types.UserInfo:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  types.UserWithRole:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      role:
        $ref: '#/definitions/types.RoleInfo'
      status:
        description: active, pending, suspended
        type: string
    type: object
  types.nominal_impedence:
    properties:
      unit:
        type: string
      value:
        type: string
    type: object
  types.powerOutput:
    properties:
      asymmetrical:
        properties:
          peak_per_channel:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
          peak_per_channel_high_voltage:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
          rated_per_channel:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
          rated_per_channel_high_voltage:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
        type: object
      symmetrical:
        properties:
          peak_per_channel:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
          peak_per_channel_high_voltage:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
          rated_per_channel:
            properties:
              at:
                items:
                  properties:
                    impedance:
                      properties:
                        unit:
                          type: string
                        value:
                          type: integer
                      type: object
                    power:
                      properties:
                        unit:
                          type: string
                        value:
                          type: integer
                      type: object
                  type: object
                type: array
            type: object
          rated_per_channel_high_voltage:
            properties:
              at:
                items:
                  properties:
                    key:
                      type: string
                    value:
                      type: integer
                  type: object
                type: array
              unit:
                type: string
            type: object
        type: object
    type: object
host: localhost:8020
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the Fusion Cloud Backend API server providing comprehensive
    role-based access control, user management, and project management capabilities.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Fusion Cloud Backend API
  version: "1.0"
paths:
  /auth/status:
    get:
      consumes:
      - application/json
      description: Check if the current user is properly authenticated and return
        basic status
      produces:
      - application/json
      responses:
        "200":
          description: User is authenticated
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User is not authenticated
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Check authentication status
      tags:
      - auth
  /organization/role-management:
    get:
      consumes:
      - application/json
      description: Get comprehensive role management data including roles, features,
        access levels, and users for the organization
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved role management data
          schema:
            $ref: '#/definitions/types.RoleManagementResponse'
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - Insufficient permissions for role management
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get organization role management data
      tags:
      - role-management
  /organization/roles:
    post:
      consumes:
      - application/json
      description: Create a new role with the specified name and description in the
        organization
      parameters:
      - description: Role creation details
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/types.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created role
          schema:
            $ref: '#/definitions/types.RoleWithPermissions'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - Insufficient permissions to create roles
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new role
      tags:
      - role-management
  /organization/roles/{roleID}/permissions:
    put:
      consumes:
      - application/json
      description: Update the permissions assigned to a specific role within the organization
      parameters:
      - description: Role ID
        in: path
        name: roleID
        required: true
        type: string
      - description: Permission updates
        in: body
        name: permissions
        required: true
        schema:
          items:
            $ref: '#/definitions/types.PermissionUpdateRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated role permissions
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - Invalid JSON payload or invalid role ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - Insufficient permissions to update role permissions
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update role permissions
      tags:
      - role-management
  /organization/users:
    get:
      consumes:
      - application/json
      description: Get all users within the organization along with their role information
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved organization users
          schema:
            $ref: '#/definitions/types.OrganizationUsersResponse'
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - Insufficient permissions to view organization users
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get organization users
      tags:
      - role-management
  /organization/users/{userID}/role:
    put:
      consumes:
      - application/json
      description: Update the role assignment for a specific user within the organization
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: Role assignment details
        in: body
        name: roleAssignment
        required: true
        schema:
          $ref: '#/definitions/types.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated user role
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - Invalid JSON payload or missing user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden - Insufficient permissions to update user roles
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - role-management
  /products:
    get:
      consumes:
      - application/json
      description: Get all available products including speakers, amplifiers and digital
        signal processors
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with all products
          schema:
            $ref: '#/definitions/types.ProductResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all products
      tags:
      - products
  /products/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific product by its unique identifier
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with product details
          schema:
            $ref: '#/definitions/types.ProductResponse'
        "400":
          description: Bad request - Product ID is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product by ID
      tags:
      - products
  /projects:
    get:
      consumes:
      - application/json
      description: Get all projects in the system
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all projects
          schema:
            items:
              $ref: '#/definitions/types.Project'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project in the system
      parameters:
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/types.Project'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created project
          schema:
            $ref: '#/definitions/types.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new project
      tags:
      - projects
  /projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted project
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get a specific project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved project
          schema:
            $ref: '#/definitions/types.Project'
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project by ID
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update an existing project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/types.Project'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated project
          schema:
            $ref: '#/definitions/types.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update project
      tags:
      - projects
  /projects/{id}/sync:
    post:
      consumes:
      - application/json
      description: Synchronize project data with external source using metadata and
        ZIP file URL
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Sync request containing metadata and ZIP file URL
        in: body
        name: syncRequest
        required: true
        schema:
          $ref: '#/definitions/types.SyncProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated project sync
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sync project
      tags:
      - projects
  /user/me/authorization:
    get:
      consumes:
      - application/json
      description: Get authorization details including user info, account, role, and
        permissions for the current authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user authorization details
          schema:
            $ref: '#/definitions/types.UserAuthorizationResponse'
        "401":
          description: Unauthorized - User email not found in token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user authorization details
      tags:
      - auth
  /user/me/profile:
    get:
      consumes:
      - application/json
      description: Get the current authenticated user's profile information
      produces:
      - application/json
      responses:
