basePath: /api/v1
definitions:
  types.Budget:
    properties:
      amount:
        type: number
      currency:
        type: string
    type: object
  types.PriceDetail:
    properties:
      currency:
        type: string
      price:
        type: number
      variant:
        type: string
    type: object
  types.PriceResponse:
    properties:
      prices:
        items:
          $ref: '#/definitions/types.PriceDetail'
        type: array
      product_id:
        type: integer
    type: object
  types.ProductItemResponse:
    properties:
      assets:
        items:
          type: object
        type: array
      description:
        type: string
      model_family:
        type: string
      model_name:
        type: string
      productid:
        type: integer
      specifications:
        type: object
    type: object
  types.ProductResponse:
    properties:
      accessory:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
      amplifier:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
      controller:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
      dsp:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
      io_endpoint:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
      speaker:
        items:
          $ref: '#/definitions/types.ProductItemResponse'
        type: array
    type: object
  types.Project:
    properties:
      application:
        type: string
      budget:
        $ref: '#/definitions/types.Budget'
      description:
        type: string
      id:
        type: string
      meta_data:
        additionalProperties: true
        type: object
      name:
        type: string
      organization_id:
        type: string
      project_file_url:
        type: string
      venue:
        type: string
      venue_type:
        type: string
    type: object
  types.SingleProductResponse:
    properties:
      accessory:
        $ref: '#/definitions/types.ProductItemResponse'
      amplifier:
        $ref: '#/definitions/types.ProductItemResponse'
      controller:
        $ref: '#/definitions/types.ProductItemResponse'
      dsp:
        $ref: '#/definitions/types.ProductItemResponse'
      io_endpoint:
        $ref: '#/definitions/types.ProductItemResponse'
      speaker:
        $ref: '#/definitions/types.ProductItemResponse'
    type: object
  types.SyncProjectRequest:
    properties:
      meta_data:
        additionalProperties: true
        type: object
      zip_file_url:
        example: https://example.com/project.zip
        type: string
    required:
    - meta_data
    - zip_file_url
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the Fusion Cloud Backend API server.
  title: Fusion Cloud Backend API
  version: "1.0"
paths:
  /products:
    get:
      consumes:
      - application/json
      description: Get all available products including speakers, amplifiers, DSPs,
        controllers, and endpoints
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with all products
          schema:
            $ref: '#/definitions/types.ProductResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all products
      tags:
      - products
  /products/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific product by its unique identifier
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with product details
          schema:
            $ref: '#/definitions/types.SingleProductResponse'
        "400":
          description: Bad request - Product ID is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product by ID
      tags:
      - products
  /products/{id}/prices:
    get:
      consumes:
      - application/json
      description: Get prices for a specific product by its unique identifier, optionally
        filtered by currency
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Currency code (e.g., USD, EUR) to filter prices
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful response with product prices
          schema:
            $ref: '#/definitions/types.PriceResponse'
        "400":
          description: Bad request - Product ID is required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Product not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get product prices by ID
      tags:
      - products
  /projects:
    get:
      consumes:
      - application/json
      description: Get all projects in the system
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all projects
          schema:
            items:
              $ref: '#/definitions/types.Project'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project in the system
      parameters:
      - description: Project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/types.Project'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created project
          schema:
            $ref: '#/definitions/types.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new project
      tags:
      - projects
  /projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted project
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get a specific project by its unique identifier
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved project
          schema:
            $ref: '#/definitions/types.Project'
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project by ID
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update an existing project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated project details
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/types.Project'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated project
          schema:
            $ref: '#/definitions/types.Project'
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update project
      tags:
      - projects
  /projects/{id}/sync:
    post:
      consumes:
      - application/json
      description: Synchronize project data with external source using metadata and
        ZIP file URL
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Sync request containing metadata and ZIP file URL
        in: body
        name: syncRequest
        required: true
        schema:
          $ref: '#/definitions/types.SyncProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully initiated project sync
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request - Invalid JSON payload
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sync project
      tags:
      - projects
schemes:
- http
- https
swagger: "2.0"
