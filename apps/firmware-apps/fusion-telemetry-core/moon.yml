project:
  name: 'Fusion Telemetry Core'
  description: 'Fusion Telemetry Core moon build tasks'

tasks:

  build:
    command: "./moon-build.sh"
    deps:
      - ready-script

  ready-script:
    command: "chmod"
    args: ["+x", "moon-build.sh", "Jenkins/SetVersionProperty.sh"]
    deps:
      - fusion-embedded-interface:build-embedded-interface-shared-library