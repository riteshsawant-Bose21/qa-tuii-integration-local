# moon.yml for the fusion-edge-gateway application

project:
  name: 'Fusion Edge Gateway'
  description: 'Fusion Edge Gateway application'

tasks:

  build:
    command: "./moon-build.sh"
    deps:
      - ready-script

  ready-script:
    command: "chmod"
    args: ["+x", "moon-build.sh", "Jenkins/SetVersionProperty.sh"]
