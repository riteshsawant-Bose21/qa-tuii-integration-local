# moon.yml for the cloud-services-ui application
# go run cmd/server/main.go
# docker-compose up --build
tasks:
  build-dsp:
    command: "python3"
    args: ["./waf", "build"]
  
  go-get-mod:
    command: "go"
    args: ["get", "all"]

  build:
    command: "go"
    args: ["build", "-o", "fusion-web-services", "cmd/server/main.go"]
