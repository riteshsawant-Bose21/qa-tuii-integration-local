project:
  name: 'Fusion DSP'
  description: 'Fsion DSP application moon tasks'

tasks:
  build:
    command: |
      "source /home/ec2-user/fusion-mini-build-cache/bose/fusion/yocto-sdk/environment-setup-cortexa53-crypto-poky-linux"
      "python3 ./waf configure --platform=varmini"
      "python3 ./waf build"

  build-dsp:
    command: "python3"
    args: ["./waf", "build"]
    deps:
      - waf-configure
  
  waf-configure:
    command: "python3"
    args: ["./waf", "configure", "--platform=varmini"]

  setup-cross-compile-toolchain:
    command: "source"
    args: ["/home/ec2-user/fusion-mini-build-cache/bose/fusion/yocto-sdk/environment-setup-cortexa53-crypto-poky-linux"]
