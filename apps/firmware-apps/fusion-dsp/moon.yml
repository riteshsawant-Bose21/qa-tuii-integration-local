project:
  name: 'Fusion DSP'
  description: 'Fusion DSP application moon tasks'

tasks:

  dsp-package:
    command: "python3"
    args: ["package.py"]
    deps:
      - build

  build:
    command: "./moon-build.sh"
    deps:
      - ready-script

  ready-script:
    command: "chmod"
    args: ["+x", "moon-build.sh", "Jenkins/SetVersionProperty.sh"]
