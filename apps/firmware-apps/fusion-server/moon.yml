# moon.yml for the cloud-services-ui application
# go run cmd/server/main.go
# docker-compose up --build
project:
  name: 'Fusion Server'
  description: 'Go based FUsion server application'

language: go

tasks:
  build:
    command: "./build-fusion-server"
    args: ["--package"]
    deps:
      - ready-script

  ready-script:
    command: "chmod"
    args: ["+x", "build-fusion-server"]
