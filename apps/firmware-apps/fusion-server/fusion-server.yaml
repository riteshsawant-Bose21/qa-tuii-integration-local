#cloud-config
package_update: true
package_upgrade: true

packages:
  - haproxy
  - keepalived

write_files:
  - path: /etc/systemd/system/fusion-server.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Fusion Server
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/fusion-server -name %H -addr 0.0.0.0 -port 7946
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /etc/keepalived/keepalived.conf
    permissions: '0644'
    owner: root:root
    content: |
      global_defs {
        script_security
      }

      vrrp_script chk_haproxy {
          script "/usr/local/bin/check-haproxy.sh"
          interval 2
          weight 2
          user root
      }

      vrrp_instance VI_1 {
          interface enp0s1
          state BACKUP
          nopreempt
          virtual_router_id 51
          priority 100
          advert_int 1
          authentication {
              auth_type PASS
              auth_pass fusionpass
          }
          virtual_ipaddress {
              192.168.64.100/24
          }
          track_script {
              chk_haproxy
          }
      }

  - path: /usr/local/bin/check-haproxy.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      systemctl is-active --quiet haproxy

  - path: /usr/local/bin/setup-fusion.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      set -ex
      
      # Create required directories
      mkdir -p /etc/haproxy /etc/keepalived /var/lib/fusion
      
      # Get gateway IP
      GATEWAY=$(ip route show | grep default | awk '{print $3}')
      echo "Gateway IP: $GATEWAY"
      
      # Download fusion-server with retry
      MAX_RETRIES=5
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        if curl -L --connect-timeout 10 "http://$GATEWAY:8000/build/fusion-server" -o /usr/local/bin/fusion-server; then
          chmod +x /usr/local/bin/fusion-server
          echo "Successfully downloaded and configured fusion-server"
          break
        fi
        RETRY_COUNT=$((RETRY_COUNT + 1))
        echo "Attempt $RETRY_COUNT failed, retrying in 10 seconds..."
        sleep 10
      done
      
      # Enable and start services
      systemctl daemon-reload
      systemctl enable fusion-server
      systemctl start fusion-server
      
      # Start keepalived
      systemctl enable keepalived
      systemctl start keepalived
      
      # Show status
      echo "Service status:"
      systemctl status fusion-server --no-pager || true
      systemctl status keepalived --no-pager || true
      ip addr show

runcmd:
  - bash -x /usr/local/bin/setup-fusion.sh