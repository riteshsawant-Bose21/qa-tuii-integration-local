#cloud-config
package_update: true
package_upgrade: true
packages:
 - curl
 - haproxy
 - keepalived
write_files:
 - path: /etc/systemd/resolved.conf
   content: |
     [Resolve]
     DNS=8.8.8.8
     FallbackDNS=8.8.4.4
 - path: /etc/keepalived/keepalived.conf
   content: |
    ! Configuration File for keepalived
    global_defs {
      enable_script_security
      max_auto_priority 99
      vrrp_garp_master_delay 1
      vrrp_garp_master_repeat 3
      vrrp_garp_master_refresh 1
      vrrp_garp_master_refresh_repeat 2
      vrrp_skip_check_adv_addr
      log_unknown_vrids
    }

    vrrp_instance VI_1 {
        state MASTER
        interface enp0s1
        virtual_router_id 51
        priority 100
        advert_int 1
        virtual_ipaddress {
            192.168.64.100/24
        }
    }

 - path: /etc/systemd/system/fusion-server.service
   content: |
    [Unit]
    Description=Fusion Server
    After=network.target

    [Service]
    Type=simple
    ExecStart=/usr/local/bin/fusion-server --name fusion-server-01 --addr 0.0.0.0 --port 7946
    Restart=always
    AmbientCapabilities=CAP_NET_BIND_SERVICE
    
    [Install]
    WantedBy=multi-user.target

runcmd:
 # Set initial directory permissions
 - sudo mkdir -p /etc/haproxy
 - sudo chown -R haproxy:haproxy /etc/haproxy
 - sudo chmod 755 /etc/haproxy
 
 - sudo mkdir -p /etc/keepalived
 - sudo chown -R root:root /etc/keepalived

 - sudo mkdir -p /var/lib/fusion
 - sudo chown -R ubuntu:ubuntu /var/lib/fusion

 # Copy over 
 - curl -L "10.0.0.157:8000/fusion/fusion-server" -o /usr/local/bin/fusion-server
 - chmod +x /usr/local/bin/fusion-server

 # Write HAProxy config
 - |
   sudo tee /etc/haproxy/haproxy.cfg << 'EOF'
   global
    log stdout format raw local0 debug
    maxconn 32768
    user haproxy
    group haproxy
   defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
   frontend http_front
    bind *:80
    default_backend servers
   backend servers
    balance roundrobin
    option httpchk GET /getValue HTTP/1.1
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
   EOF

 # Write HAProxy service file
 - |
   sudo tee /etc/systemd/system/haproxy.service << 'EOF'
   [Unit]
   Description=HAProxy Load Balancer
   After=network.target
   [Service]
   Type=simple
   ExecStart=/usr/sbin/haproxy -f /etc/haproxy/haproxy.cfg -db
   Restart=always
   [Install]
   WantedBy=multi-user.target
   EOF

 # Set file permissions (after files are created)
 - sudo chown haproxy:haproxy /etc/haproxy/haproxy.cfg
 - sudo chmod 666 /etc/haproxy/haproxy.cfg  # Temporarily very permissive for testing
 - sudo chmod 644 /etc/systemd/system/haproxy.service
 - sudo chmod 644 /etc/keepalived/keepalived.conf

 # Start services
 - systemctl restart systemd-resolved
 - sudo systemctl daemon-reload
 - sudo systemctl enable haproxy
 - sudo systemctl start haproxy
 - sudo systemctl enable keepalived
 - sudo systemctl start keepalived
 - sudo systemctl enable fusion-server
 - sudo systemctl start fusion-server
