#cloud-config
package_update: true
package_upgrade: true
packages:
 - curl
 - haproxy
 - keepalived
write_files:
 - path: /etc/systemd/resolved.conf
   content: |
     [Resolve]
     DNS=8.8.8.8
     FallbackDNS=8.8.4.4
 - path: /etc/keepalived/keepalived.conf
   content: |
    ! Configuration File for keepalived
    global_defs {
      enable_script_security
      max_auto_priority 99
      vrrp_garp_master_delay 1
      vrrp_garp_master_repeat 3
      vrrp_garp_master_refresh 1
      vrrp_garp_master_refresh_repeat 2
      vrrp_skip_check_adv_addr
      log_unknown_vrids
    }

    vrrp_instance VI_1 {
        state MASTER
        interface enp0s1
        virtual_router_id 51
        priority 100
        advert_int 1
        virtual_ipaddress {
            192.168.64.100/24
        }
    }

runcmd:
 - systemctl restart systemd-resolved
 # Create directories
 - sudo mkdir -p /etc/haproxy
 - sudo mkdir -p /etc/keepalived
 # Set correct ownership
 - sudo chown -R haproxy:haproxy /etc/haproxy
 - sudo chown -R root:root /etc/keepalived
 # Write HAProxy config
 - |
   sudo tee /etc/haproxy/haproxy.cfg << 'EOF'
   global
    log stdout format raw local0 debug
    maxconn 32768
    user haproxy
    group haproxy
   defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
   frontend http_front
    bind *:80
    default_backend servers
   backend servers
    balance roundrobin
    option httpchk GET /getValue HTTP/1.1
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
   EOF
 # Write HAProxy service file
 - |
   sudo tee /etc/systemd/system/haproxy.service << 'EOF'
   [Unit]
   Description=HAProxy Load Balancer
   After=network.target
   [Service]
   Type=simple
   ExecStart=/usr/sbin/haproxy -f /etc/haproxy/haproxy.cfg -db
   Restart=always
   [Install]
   WantedBy=multi-user.target
   EOF
 # Set permissions
 - sudo chmod 644 /etc/haproxy/haproxy.cfg
 - sudo chmod 644 /etc/systemd/system/haproxy.service
 - sudo chmod 644 /etc/keepalived/keepalived.conf
 # Start services
 - sudo systemctl daemon-reload
 - sudo systemctl enable haproxy
 - sudo systemctl start haproxy
 - sudo systemctl enable keepalived
 - sudo systemctl start keepalived
