info:
  name: Upsert Definitions
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{api_url}}/value"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "snapshots": [
          {
            "id": "snapshot-test-01",
            "name": "Snapshot Test",
            "data": {
              "feature_probe": {
                "mode": "snapshot",
                "level": 10
              }
            }
          }
        ],
        "scene_sets": [
          {
            "set_id": "scene-set-test-01",
            "name": "Dayparts",
            "default_scene": "scene-morning-01",
            "scenes": [
              {
                "id": "scene-morning-01",
                "name": "Morning",
                "data": {
                  "feature_probe": {
                    "mode": "morning",
                    "level": 1
                  }
                }
              },
              {
                "id": "scene-evening-01",
                "name": "Evening",
                "data": {
                  "feature_probe": {
                    "mode": "evening",
                    "level": 9
                  }
                }
              }
            ]
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Create or overwrite snapshot definitions and scene-set definitions in the state store. Re-sending the same id/set_id overwrites (clobbers) the previous entry.
