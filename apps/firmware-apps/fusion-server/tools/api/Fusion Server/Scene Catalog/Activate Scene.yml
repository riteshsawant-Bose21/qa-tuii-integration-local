info:
  name: Activate Scene
  type: http
  seq: 7

http:
  method: POST
  url: "{{api_url}}/scene-sets/activate"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "set_id": "scene-set-test-01",
        "scene_id": "scene-evening-01"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Patches the active state with the named scene data block and records it as the current scene for that set.
