info:
  name: Get Current Scene
  type: http
  seq: 15

http:
  method: POST
  url: "{{api_url}}/scene-sets/current-scene"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "set_id": "scene-set-test-01"
      }

settings:
