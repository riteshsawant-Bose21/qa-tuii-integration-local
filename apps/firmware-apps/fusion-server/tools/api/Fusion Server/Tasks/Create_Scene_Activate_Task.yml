info:
  name: Create Scene Activate Task
  type: http
  seq: 10

http:
  method: POST
  url: "{{api_url}}/tasks"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "scene-activate-task-001",
        "description": "Activate evening scene",
        "cron_expr": "0 30 18 * * *",
        "set_id": "scene-set-test-01",
        "scene_id": "scene-evening-01"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Creates a scene activate task using the protobuf JSON request shape.
