info:
  name: Create Activate Snapshot Task
  type: http
  seq: 7

http:
  method: POST
  url: "{{api_url}}/tasks"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "analog-input",
        "cron_expr": "@every 2s",
        "description": "Change to analog input",
        "type": "snapshot",
        "params": {
          "snapshot_id": "analog"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
