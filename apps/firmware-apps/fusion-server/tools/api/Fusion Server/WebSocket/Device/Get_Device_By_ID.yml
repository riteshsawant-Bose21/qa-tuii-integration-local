info:
  name: Get Device By ID
  type: websocket
  seq: 1

websocket:
  url: ws://{{api_url}}/ws
  message:
    type: json
    data: |
      {
        "id": "device-001",
        "version": 1,
        "type": "device_by_id",
        "data": {
          "device_id": "fusion_dha3vl5kxmdn_1md6_instance"
        }
      }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |
  Get a specific device by ID and automatically subscribe to device updates.

  **Response (3000 OK):**
  ```json
  {
    "id": "device-001",
    "version": 1,
    "type": "device",
    "code": 3000,
    "status": "success",
    "message": "OK",
    "data": {
      "id": "fusion-1",
      "name": "Device 1",
      "address": "192.168.1.100",
      "location": "Building A"
    },
    "timestamp": "2026-03-24T10:00:00Z"
  }
  ```
