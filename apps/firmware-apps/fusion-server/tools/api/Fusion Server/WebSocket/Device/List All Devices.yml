info:
  name: List All Devices
  type: websocket
  seq: 2

websocket:
  url: ws://{{api_url}}/ws
  message:
    type: json
    data: |
      {
        "id": "devices-001",
        "version": 1,
        "type": "devices"
      }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |
  List all devices and automatically subscribe to device updates.

  **Response (3000 OK):**
  ```json
  {
    "id": "devices-001",
    "version": 1,
    "type": "devices",
    "code": 3000,
    "status": "success",
    "message": "OK",
    "data": [
      {
        "id": "fusion-1",
        "name": "Device 1",
        "address": "192.168.1.100",
        "location": "Building A"
      }
    ],
    "timestamp": "2026-03-24T10:00:00Z"
  }
  ```

  Auto-subscribes to device_update push notifications.
