<!DOCTYPE html>
<html>

<head>
  <title>API Test</title>
</head>

<body>
  <h1>API Test</h1>
  <button onclick="testApi()">Test API</button>
  <pre id="result"></pre>

  <script>
    async function testApi() {
      const resultElement = document.getElementById('result');
      try {
        const response = await fetch('http://192.168.2.100:8080/metrics', {
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          }
        });

        resultElement.textContent = 'Status: ' + response.status + '\n';
        resultElement.textContent += 'Headers: ' + JSON.stringify(Array.from(response.headers.entries()), null, 2) + '\n';

        const text = await response.text();
        resultElement.textContent += 'Body: ' + text.substring(0, 200) + '...';

      } catch (error) {
        resultElement.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>

</html>
