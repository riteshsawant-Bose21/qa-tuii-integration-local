vrrp_script chk_haproxy {
    script "/usr/local/bin/check-haproxy.sh"
    interval 2
    weight 2
}

global_defs {
    enable_script_security    # Add this line to enable script security
}

vrrp_instance VI_1 {
    state BACKUP
    interface enp0s1
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass fusion
    }
    virtual_ipaddress {
        192.168.64.100/24
    }
    track_script {
        chk_haproxy
    }
}
