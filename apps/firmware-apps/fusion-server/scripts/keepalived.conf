global_defs {
    script_security
}

vrrp_script chk_haproxy {
    script "/usr/local/bin/check-haproxy.sh"
    interval 2
    weight 2
    user root
}

vrrp_instance VI_1 {
    interface enp0s1
    state BACKUP
    nopreempt
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass fusionpass
    }
    virtual_ipaddress {
        192.168.64.100/24
    }
    track_script {
        chk_haproxy
    }
}
