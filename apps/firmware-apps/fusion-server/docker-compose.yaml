version: '3'
services:    
  dsp1:
    image: fusion-server
    networks:
      fusionnet:
        ipv4_address: 172.18.0.3
    ports:
      - "7946:7946"
    environment:
      - SERVICE_IP=172.18.0.3
      - SERVICE_NAME=dsp1
    command: ["./fusion-gossip", "--name", "dsp1", "--addr", "0.0.0.0", "--port", "7946"]

  dsp2:
    image: fusion-server
    networks:
      fusionnet:
        ipv4_address: 172.18.0.4
    ports:
      - "7947:7946"
    environment:
      - SERVICE_IP=172.18.0.4
      - SERVICE_NAME=dsp2
    command: ["./fusion-gossip", "--name", "dsp2", "--addr", "0.0.0.0", "--port", "7946", "172.18.0.3:7946"]
    depends_on:
      - dsp1

  dsp3:
    image: fusion-server
    networks:
      fusionnet:
        ipv4_address: 172.18.0.5
    ports:
      - "7948:7946"
    environment:
      - SERVICE_IP=172.18.0.5
      - SERVICE_NAME=dsp3
    command: ["./fusion-gossip", "--name", "dsp3", "--addr", "0.0.0.0", "--port", "7946", "172.18.0.3:7946"]
    depends_on:
      - dsp1

  dsp4:
    image: fusion-server
    networks:
      fusionnet:
        ipv4_address: 172.18.0.6
    ports:
      - "7949:7946"
    environment:
      - SERVICE_IP=172.18.0.6
      - SERVICE_NAME=dsp4
    command: ["./fusion-gossip", "--name", "dsp4", "--addr", "0.0.0.0", "--port", "7946", "172.18.0.3:7946"]
    depends_on:
      - dsp1

  loadbalancer1:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      fusionnet:
        ipv4_address: 172.18.0.7
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - dsp1
      - dsp2
      - dsp3
      - dsp4

  loadbalancer2:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      fusionnet:
        ipv4_address: 172.18.0.8
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - dsp1
      - dsp2
      - dsp3
      - dsp4

  keepalived1:
    image: osixia/keepalived:2.0.20
    platform: linux/arm64
    volumes:
      - ./keepalived-master.conf:/container/service/keepalived/assets/keepalived-master.conf
    networks:
      fusionnet:
        ipv4_address: 172.18.0.9
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - loadbalancer1

  keepalived2:
    image: osixia/keepalived:2.0.20
    platform: linux/arm64
    volumes:
      - ./keepalived-backup.conf:/container/service/keepalived/assets/keepalived-backup.conf
    networks:
      fusionnet:
        ipv4_address: 172.18.0.10
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - loadbalancer2

networks:
  fusionnet:
    external: true
