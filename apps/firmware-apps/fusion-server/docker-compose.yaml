services:    

  dsp1:
    image: ${FUSION_SERVER_IMAGE}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${DSP1_SUFFIX}
    ports:
      - "${DSP1_PORT}:${GOSSIP_PORT}"
    environment:
      - SERVICE_IP=${NETWORK_PREFIX}.${DSP1_SUFFIX}
      - SERVICE_NAME=dsp1
    command: ${DSP1_COMMAND}

  dsp2:
    image: ${FUSION_SERVER_IMAGE}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${DSP2_SUFFIX}
    ports:
      - "${DSP2_PORT}:${GOSSIP_PORT}"
    environment:
      - SERVICE_IP=${NETWORK_PREFIX}.${DSP2_SUFFIX}
      - SERVICE_NAME=dsp2
    command: ${DSP2_COMMAND}
    depends_on:
      - dsp1

  dsp3:
    image: ${FUSION_SERVER_IMAGE}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${DSP3_SUFFIX}
    ports:
      - "${DSP3_PORT}:${GOSSIP_PORT}"
    environment:
      - SERVICE_IP=${NETWORK_PREFIX}.${DSP3_SUFFIX}
      - SERVICE_NAME=dsp3
    command: ${DSP3_COMMAND}
    depends_on:
      - dsp1

  dsp4:
    image: ${FUSION_SERVER_IMAGE}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${DSP4_SUFFIX}
    ports:
      - "${DSP4_PORT}:${GOSSIP_PORT}"
    environment:
      - SERVICE_IP=${NETWORK_PREFIX}.${DSP4_SUFFIX}
      - SERVICE_NAME=dsp4
    command: ${DSP4_COMMAND}
    depends_on:
      - dsp1

  loadbalancer1:
    image: ${NGINX_IMAGE}
    volumes:
      - ${NGINX_CONF_PATH}:/etc/nginx/nginx.conf:ro
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${LB1_SUFFIX}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - dsp1
      - dsp2
      - dsp3
      - dsp4

  loadbalancer2:
    image: ${NGINX_IMAGE}
    volumes:
      - ${NGINX_CONF_PATH}:/etc/nginx/nginx.conf:ro
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${LB2_SUFFIX}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    depends_on:
      - dsp1
      - dsp2
      - dsp3
      - dsp4

  keepalived1:
    image: ${KEEPALIVED_IMAGE}
    platform: ${KEEPALIVED_PLATFORM}
    volumes:
      - ${KEEPALIVED_PRIMARY_CONF}:/container/service/keepalived/assets/${KEEPALIVED_PRIMARY_CONF}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${KEEPALIVED1_SUFFIX}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      - KEEPALIVED_COMMAND=${KEEPALIVED_COMMAND}
    depends_on:
      - loadbalancer1

  keepalived2:
    image: ${KEEPALIVED_IMAGE}
    platform: ${KEEPALIVED_PLATFORM}
    volumes:
      - ${KEEPALIVED_BACKUP_CONF}:/container/service/keepalived/assets/${KEEPALIVED_BACKUP_CONF}
    networks:
      fusionnet:
        ipv4_address: ${NETWORK_PREFIX}.${KEEPALIVED2_SUFFIX}
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      - KEEPALIVED_COMMAND=${KEEPALIVED_COMMAND}
    depends_on:
      - loadbalancer2

networks:
  fusionnet:
    external: true