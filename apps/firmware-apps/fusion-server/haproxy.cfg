global
    log stdout format raw local0 debug
    maxconn 32768
    user haproxy
    group haproxy
    
defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_front
   bind *:80
   default_backend servers

backend servers
    balance roundrobin
    option httpchk GET /getValue HTTP/1.1
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server srv1 172.18.0.3:8080 check
    server srv2 172.18.0.4:8080 check
    
# Make sure there's a newline at the end of the file

