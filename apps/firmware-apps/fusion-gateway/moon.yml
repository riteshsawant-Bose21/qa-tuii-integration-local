# moon.yml for the cloud-services-ui application
# go run cmd/server/main.go
# docker-compose up --build
project:
  name: 'Fusion Gateway'
  description: 'Go-based Fusion gateway application'

language: go

tasks:
  build:
    command: "./build-fusion-gateway"
    args: ["--package"]
    deps:
      - 'ready-script'

  ready-script:
    command: "chmod"
    args: ["+x", "build-fusion-gateway", "Jenkins/SetVersionProperty.sh"] 