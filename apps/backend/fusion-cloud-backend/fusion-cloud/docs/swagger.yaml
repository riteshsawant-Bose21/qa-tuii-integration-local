basePath: /api/v1
definitions:
  model.ClaimDeviceRequest:
    properties:
      cloud_id:
        type: string
      mac:
        type: string
      name:
        type: string
      sn:
        type: string
      space_id:
        type: integer
    type: object
  model.ProjectRequest:
    properties:
      description:
        type: string
      metadata:
        description: JSON string for additional project data
        type: string
      name:
        type: string
    required:
    - name
    type: object
  model.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.SpaceRequest:
    properties:
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
    type: object
  model.UserLogin:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.UserMetaData:
    properties:
      address:
        properties:
          addressLine1:
            type: string
          addressLine2:
            type: string
          city:
            type: string
          country:
            type: string
          state:
            type: string
          timezone:
            type: string
          zipCode:
            type: string
        type: object
      currency:
        type: string
      language:
        type: string
      location:
        type: string
      measurementUnit:
        type: string
      notifications:
        properties:
          productUpdates:
            type: boolean
          projectActivity:
            type: boolean
          trainingAndResources:
            type: boolean
        type: object
      personalInfo:
        description: |-
          xyteApiKey is used to store the API key for the XYTE service
          It is not exposed in the API response and is stored securely.
        properties:
          jobTitle:
            type: string
          name:
            type: string
          organization:
            type: string
          phone:
            type: string
        type: object
      security:
        properties:
          enableEmailNotifications:
            type: boolean
          enableSMSNotifications:
            type: boolean
          isTwoFactorEnabled:
            type: boolean
          password:
            type: string
          username:
            type: string
        type: object
      xyte_api_key:
        type: string
    required:
    - xyte_api_key
    type: object
  model.UserRegistration:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  model.UserResponse:
    properties:
      created_at:
        description: MetaData is returned in the response, but sensitive fields like
          API keys are not included
        type: string
      email:
        type: string
      id:
        type: integer
      metadata:
        type: string
      updated_at:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:8020
info:
  contact: {}
  description: Fusion Cloud API provides a RESTful interface for managing projects,
    users, and authentication.
  title: Fusion Cloud API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with email and password
      parameters:
      - description: User login details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.UserLogin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login a user
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refresh the user's authentication token using a valid refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: refreshToken
        required: true
        schema:
          $ref: '#/definitions/model.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Refresh user token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.UserRegistration'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Register a new user
      tags:
      - auth
  /devices:
    get:
      description: Get all devices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
