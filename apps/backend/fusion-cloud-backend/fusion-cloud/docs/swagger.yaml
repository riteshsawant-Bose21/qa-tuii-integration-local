          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: claim a device
      tags:
      - device
  /devices/histories:
    get:
      description: Get Device Histories by various filters
      parameters:
      - description: Device ID
        in: query
        name: device_id
        required: true
        type: string
      - description: Device status
        in: query
        name: status
        type: string
      - description: From time (ISO8601 or timestamp)
        in: query
        name: from
        type: string
      - description: To time (ISO8601 or timestamp)
        in: query
        name: to
        type: string
      - description: Space ID
        in: query
        name: space_id
        type: string
      - description: Device name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Device Histories
      tags:
      - device
  /file-preview/{fileId}:
    get:
      description: Downloads a file using file ID
      parameters:
      - description: File ID
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Get a file
      tags:
      - file
  /files/{fileId}:
    get:
      description: Downloads a file using file ID
