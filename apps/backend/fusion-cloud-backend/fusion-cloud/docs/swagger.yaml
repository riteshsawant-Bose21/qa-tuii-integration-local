          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: get a device
      tags:
      - device
  /devices/claim:
    post:
      consumes:
      - application/json
      description: Claim a device by its ID
      parameters:
