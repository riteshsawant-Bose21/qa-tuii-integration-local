syntax = "proto3";

package fusion.deviceconfig.v1;

import "google/protobuf/struct.proto";

option go_package = "fusion/internal/gen/proto/fusion;fusionpb";

// DroConditionedOutputEnvelope models the configurator response envelope seen in
// fusion-dsp-configurator-prototype/outputs/*.json.
//
// This is not the same thing as the PUT /device deployment package. The
// deployment package may be assembled from this conditioned output plus other
// launcher-managed sections.
message DroConditionedOutputEnvelope {
  string request_id = 1;
  string response_id = 2;
  int32 status_code = 3;
  string status_message = 4;
  string version = 5;
  DroConditionedOutput result = 6;
}

// DroConditionedOutput is the current best representation of the "result"
// object emitted by the DSP configurator.
message DroConditionedOutput {
  repeated DroConditionedDevice devices = 1;
  repeated DroAes67Stream aes67_streams = 2;
  repeated DroDeviceConnection device_connections = 3;
  repeated DroIoPort io_ports = 4;
  repeated DroLatency latencies = 5;
  double total_cost = 6;
}

// DeviceConfigurationPackage is the first-pass typed contract for PUT /device.
//
// It intentionally separates the DRO-conditioned output from the additional
// DSP deployment information generated by Fusion Connect / launcher.
message DeviceConfigurationPackage {
  DroConditionedOutput dro_conditioned_output = 1;
  FusionConnectAdditions fusion_connect_additions = 2;
}

// FusionConnectAdditions captures the extra deployment-time information added
// outside the raw DRO-conditioned output.
message FusionConnectAdditions {
  repeated FusionConnectAudioStream audio_streams = 1;
  FusionConnectAudioSettings settings = 2;
}

// DroConditionedDevice comes from the configurator result and owns the deployable
// DSP static configuration for one device.
message DroConditionedDevice {
  string id = 1;
  string label = 2;
  string device_type = 3;
  string location = 4;
  double cost = 5;
  repeated DroCore cores = 6;
  repeated google.protobuf.ListValue connections_device_in = 7;
  repeated google.protobuf.ListValue connections_device_out = 8;
  StaticConfiguration dsp_static_config = 9;
}

message DroCore {
  string label = 1;
  double util_algs = 2;
  double util_device_connect = 3;
  double util_task_connect = 4;
  double util_total = 5;
  repeated string block_ids = 6;
}

message DroAes67Stream {
  string stream_id = 1;
  string stream_name = 2;
  string direction = 3;
  string multicast_destination_ip = 4;
  string source_device = 5;
  uint32 channels = 6;
  string description = 7;
  string destination_device = 8;
}

message DroDeviceConnection {
  string source_device = 1;
  string destination_device = 2;
  uint32 channels = 3;
  string source_port = 4;
}

message DroIoPort {
  string io_id = 1;
  string device_id = 2;
  string port_type = 3;
  repeated uint32 port_nums = 4;
}

// Latency is still provisional because no non-empty example was available in
// the inspected configurator outputs. The shape will need refinement once a
// real latency entry is mapped.
message DroLatency {
  map<string, google.protobuf.Value> values = 1;
}

message FusionConnectAudioStream {
  string source_device_uid = 1;
  string dest_device_uid = 2;
  FusionConnectAudioStreamProperties properties = 3;
}

message FusionConnectAudioStreamProperties {
  string stream_name = 1;
  string dest_ip = 2;
  uint32 channels = 3;
  uint32 source_port = 4;
  bool is_source = 5;
  bool is_fusion_connect = 6;
}

message FusionConnectAudioSettings {
  map<string, AudioBlockSettings> audio = 1;
}

message AudioBlockSettings {
  map<string, google.protobuf.Value> parameters = 1;
}

// StaticConfiguration mirrors the conditioned DSP output shape currently stored
// under result.devices[*].dsp_static_config.
message StaticConfiguration {
  SessionConfiguration session = 1;
  repeated AudioTask audio_tasks = 2;
  repeated TaskConnection task_connections = 3;
  repeated ParameterSetting parameter_settings = 4;
}

message SessionConfiguration {
  repeated PropertySetting property_settings = 1;
}

message AudioTask {
  string name = 1;
  repeated PropertySetting property_settings = 2;
  repeated Block blocks = 3;
  repeated BlockConnection block_connections = 4;
}

message Block {
  string name = 1;
  string algorithm = 2;
  repeated PropertySetting property_settings = 3;
  repeated TerminalChannels terminal_channels = 4;
}

message PropertySetting {
  string name = 1;
  google.protobuf.Value value = 2;
}

message TerminalChannels {
  string name = 1;
  uint32 channels = 2;
}

message BlockConnection {
  string source_block = 1;
  string output_terminal = 2;
  uint32 output_channel = 3;
  string destination_block = 4;
  string input_terminal = 5;
  uint32 input_channel = 6;
}

message TaskConnection {
  string source_task = 1;
  string output_block = 2;
  uint32 output_channel = 3;
  string destination_task = 4;
  string input_block = 5;
  uint32 input_channel = 6;
}

message ParameterSetting {
  string target = 1;
  string name = 2;
  repeated uint32 index = 3;
  google.protobuf.Value value = 4;
}
