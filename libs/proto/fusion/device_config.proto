syntax = "proto3";

package fusion.deviceconfig.v1;

import "google/protobuf/struct.proto";
import "fusion/device_config_audio.proto";
import "fusion/device_config_dro.proto";

option go_package = "fusion/internal/gen/proto/fusion;fusionpb";

// DroConditionedOutputEnvelope models the configurator response envelope seen in
// fusion-dsp-configurator-prototype/outputs/*.json.
//
// This is not the same thing as the PUT /device deployment package. The
// deployment package may be assembled from this conditioned output plus other
// launcher-managed sections.
message DroConditionedOutputEnvelope {
  string request_id = 1;
  string response_id = 2;
  int32 status_code = 3;
  string status_message = 4;
  string version = 5;
  DroConditionedOutput result = 6;
}

// DroConditionedOutput is the current best representation of the "result"
// object emitted by the DSP configurator.
message DroConditionedOutput {
  repeated DroConditionedDevice devices = 1;
  repeated DroAes67Stream aes67_streams = 2;
  repeated DroDeviceConnection device_connections = 3;
  repeated DroIoPort io_ports = 4;
  repeated DroLatency latencies = 5;
  double total_cost = 6;
}

// DeviceConfigurationPackage is the first-pass typed contract for PUT /device.
//
// It intentionally separates the DRO-conditioned output from the additional
// DSP deployment information generated by Fusion Connect / launcher.
message DeviceConfigurationPackage {
  DroConditionedOutput dro_conditioned_output = 1;
  FusionConnectAdditions fusion_connect_additions = 2;
}

message DeviceConfigurationPackagePutResponse {
  string status = 1;
  google.protobuf.Struct updates = 2;
}

// FusionConnectAdditions captures the extra deployment-time information added
// outside the raw DRO-conditioned output.
message FusionConnectAdditions {
  repeated FusionConnectAudioStream audio_streams = 1;
  FusionConnectAudioSettings settings = 2;
}
