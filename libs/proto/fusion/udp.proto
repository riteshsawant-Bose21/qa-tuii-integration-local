syntax = "proto3";

package fusion;

option go_package = "fusion/internal/gen/proto/fusion;fusionpb";

message UDPDebugStats {
  uint32 queue_depth = 1;
  uint32 queue_capacity = 2;
  uint64 max_queue_depth = 3;
  uint32 registered_clients = 4;
  uint32 pending_broadcasts = 5;
  int64 oldest_pending_age_ms = 6;
  uint64 enqueued_packets = 7;
  uint64 dropped_packets = 8;
  uint64 handled_packets = 9;
  uint64 ack_packets = 10;
  uint64 responses_sent = 11;
  uint64 broadcast_messages = 12;
  uint64 broadcast_datagrams = 13;
  uint64 last_broadcast_epoch = 14;
  uint64 last_broadcast_version = 15;
  int64 last_broadcast_sent_at_ns = 16;
  optional bool maintenance_enabled = 17;
}
