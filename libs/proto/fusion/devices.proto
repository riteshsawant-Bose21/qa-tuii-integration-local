syntax = "proto3";

package fusion.devices.v1;

option go_package = "fusion/internal/gen/proto/fusion;fusionpb";

message DeviceInfo {
  string address = 1;
  string id = 2;
  string location = 3;
  string name = 4;
  string model_name = 5;
  string mac_address = 6;
  string serial_number = 7;
  bool is_primary = 8;
  string software_update_version = 9;
  bool is_device_certificate_valid = 10;
  string fusion_monorepo_branch = 11;
  string fusion_monorepo_commit_hash = 12;
  string jenkins_build_number = 13;
  string pre_release_tag = 14;
  int32 vrrp_priority = 15;
}

message DevicePatch {
  optional string id = 1;
  optional string location = 2;
  optional string name = 3;
}

message DeviceListResponse {
  repeated DeviceInfo devices = 1;
}
