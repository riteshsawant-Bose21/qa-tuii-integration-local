syntax = "proto3";

package fusion.controllers.v1;

option go_package = "fusion/internal/gen/proto/fusion;fusionpb";

message ControllerInfo {
  string id = 1;
  string name = 2;
  string address = 3;
  string version = 4;
}

message ControllerListResponse {
  repeated ControllerInfo controllers = 1;
}

message ControllerWinkResponse {
  string status = 1;
  string message = 2;
  string controller_id = 3;
}
