  lucide_icons_flutter: ^3.1.6
  flutter_secure_storage: ^9.2.4

  # Authentication
  auth0_flutter: ^1.14.0

  dartzmq:
    path: ../dartzmq

  shimmer: ^3.0.0
  flutter_bloc: ^9.1.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.3

  just_audio: ^0.10.5
