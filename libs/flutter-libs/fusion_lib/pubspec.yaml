name: fusion_lib
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^1.35.2
  country_code_picker: ^3.4.1
  logger: ^2.5.0
  intl: ">=0.19.0"
