name: "Setup Toolchain"
description: "Setup the Monorepo build toolchain"

runs:
  using: "composite"
  steps:
    # Set up Proto Tool
    - name: Set up proto
      uses: moonrepo/setup-proto@v1

    # Install Moon via Proto
    - name: Install moon
      run: proto install moon

    # Install Toolchain
    - name: Run proto install
      run: proto install

    # Flutter pub cache
    - name: Cache Flutter dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-flutter-      
