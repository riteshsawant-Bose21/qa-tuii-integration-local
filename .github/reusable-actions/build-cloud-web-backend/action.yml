    - name: Cloud Services Backend Tests
      shell: bash
      working-directory: apps/cloud-backend/fusion-core
      run: |
        moon run fusion-core:test
        moon run fusion-core:integration-tests
        VERSION="${{ steps.read_version.outputs.version }}-${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)"
        docker build \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/fusion-api-image:$(git rev-parse --short HEAD) \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/fusion-api-image:latest \
          .

        docker build \
          -f sync-lambda.dockerfile \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/product-sync-image:$(git rev-parse --short HEAD) \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/product-sync-image:latest \
          .

        cd ../lambda-authorizer/
        docker build \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/auth-image:$(git rev-parse --short HEAD) \
          -t ${{ inputs.DOCKER_REGISTRY_DEV }}/auth-image:latest \
          .

