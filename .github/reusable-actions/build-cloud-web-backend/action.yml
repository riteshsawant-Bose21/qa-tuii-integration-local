name: "Build Cloud Services Backend"
description: "Build Cloud Services Backend"
inputs:
  cloud_backend_sonar_token:
    description: 'SonarQube server token'
    required: true
  nexus_password:
    description: 'Nexus repository password'
    required: true
  nexus_url:
    description: 'Nexus repository URL'
    required: true
  DOCKER_REGISTRY_DEV:
    description: 'Docker registry for development'
    required: true
  AWS_ACCESS_KEY_ID_DEV:
    description: 'AWS Access Key ID for development'
    required: true
  AWS_SECRET_ACCESS_KEY_DEV:
    description: 'AWS Secret Access Key for development'
    required: true
  AWS_ECS_CLUSTER:
    description: 'AWS ECS Cluster for development'
    required: true
  AWS_ECS_SERVICE:
    description: 'AWS ECS Service for development'
    required: true
  AWS_ECS_TASK_DEFINITION:
    description: 'AWS ECS Task Definition for development'
    required: true
  AWS_DEFAULT_REGION:
    description: 'AWS Default Region for development'
    required: true

runs:
  using: "composite"
  steps:
    - name: Read version from version.txt
      id: read_version
      working-directory: apps/cloud-backend/fusion-core
      shell: bash
      run: |
        VERSION=$(cat version.txt)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # - name: SonarQube Scan
    #   uses: SonarSource/sonarqube-scan-action@v5
