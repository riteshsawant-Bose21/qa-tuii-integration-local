name: "Build Flutter Android and iOS App"
description: "Build Flutter Android and iOS App"

runs:
  using: "composite"
  steps:
    - name: Flutter Android build
      shell: bash
      working-directory: apps/frontend/fusion-launcher-prototype
      run: |
        flutter pub get
        moon run fusion-launcher-prototype:build-apk
        curl --ssl-no-revoke -f -u Jenkins_AT:test123 -T ./build/app/outputs/flutter-apk/aap-release.apk https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/flutter-apk/aap-release.apk

    # # - name: Upload apk artifact to Nexus
    #   shell: bash
    #   working-directory: apps/frontend/fusion-launcher-prototype/build/app/outputs/flutter-apk
    #   run: |
    #     curl --ssl-no-revoke -f -u Jenkins_AT:test123 -T aap-release.apk https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/flutter-apk/aap-release.apk

    - name: Flutter iOS build
      shell: bash
      working-directory: apps/frontend/fusion-launcher-prototype
      run: |
        flutter pub get
        moon run fusion-launcher-prototype:build-iOS
        curl --ssl-no-revoke -f -u Jenkins_AT:test123 -T ./build/ios/ipa/fusion_design_tool_prototype.ipa https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/flutter-iOS/fusion_design_tool_prototype.ipa

