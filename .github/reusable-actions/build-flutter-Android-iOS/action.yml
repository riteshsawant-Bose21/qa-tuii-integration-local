name: "Build Flutter Android and iOS App"
description: "Build Flutter Android and iOS App"
inputs:
  flutter_apps_sonar_token:
    description: 'SonarQube server token'
    required: true
  nexus_password:
    description: 'Nexus repository password'
    required: true
  keychain_password:
    description: 'Keychain password for iOS build'
    required: true
    
runs:
  using: "composite"
  steps:
    - name: Read package version
      id: get_version
      uses: RCSandberg/dart-flutter-read-package-version-action@v2
      with:
        path: apps/frontend/flutter-apps/pubspec.yaml

    - name: Flutter Android build
      shell: bash
      working-directory: apps/frontend/flutter-apps
      run: |
        flutter pub get
        moon run flutter-apps:build-apk
        VERSION="${{ steps.get_version.outputs.version }}-$(git rev-parse --short HEAD)"
        curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/app/outputs/flutter-apk/app-release.apk https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/$VERSION/flutter-apk/aap-release-$VERSION.apk

    - name: Flutter iOS build
      shell: bash
      working-directory: apps/frontend/flutter-apps
      run: |
        flutter pub get
        security unlock-keychain -p "${{ inputs.keychain_password }}" /Users/devops/Library/Keychains/login.keychain-db
        moon run flutter-apps:build-iOS
        VERSION="${{ steps.get_version.outputs.version }}-$(git rev-parse --short HEAD)"
        curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/ios/ipa/fusion_design_tool_prototype.ipa https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/$VERSION/flutter-iOS/fusion_design_tool_prototype-$VERSION.ipa

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ inputs.flutter_apps_sonar_token }}
      with:
        projectBaseDir: 'apps/frontend/flutter-apps'
        args: >
          -Dsonar.c.file.suffixes=-
          -Dsonar.cpp.file.suffixes=-
          -Dsonar.objc.file.suffixes=-
          -Dsonar.exclusions=build/**
          -Dsonar.inclusions=lib/**,android/**,ios/**