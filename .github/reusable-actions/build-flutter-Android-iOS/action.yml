name: "Build Flutter Android, macOS and iOS App"
description: "Build Flutter Android, macOS and iOS App"
inputs:
  flutter_apps_sonar_token:
    description: 'SonarQube server token'
    required: true
  nexus_password:
    description: 'Nexus repository password'
    required: true
  keychain_password:
    description: 'Keychain password for iOS build'
    required: true
  notarize_apple_id:
    description: 'Apple ID for notarization'
    required: true
  notarize_app_password:
    description: 'App-specific password for notarization'
    required: true
  nexus_url:
    description: 'Nexus repository URL'
    required: true
        
runs:
  using: "composite"
  steps:
    - name: Read package version
      id: get_version
      uses: RCSandberg/dart-flutter-read-package-version-action@v2
      with:
        path: apps/frontend/flutter-apps/fusion-launcher/pubspec.yaml

    # - name: SonarQube Scan
    #   uses: SonarSource/sonarqube-scan-action@v5
    #   env:
    #     SONAR_TOKEN: ${{ inputs.flutter_apps_sonar_token }}
    #   with:
    #     projectBaseDir: 'apps/frontend/flutter-apps'
    #     args: >
    #       -Dsonar.c.file.suffixes=-
    #       -Dsonar.cpp.file.suffixes=-
    #       -Dsonar.objc.file.suffixes=-
    #       -Dsonar.exclusions=build/**
    #       -Dsonar.inclusions=lib/**,android/**,ios/**

    - name: Flutter Android, macOS and iOS Apps build
      shell: bash
      working-directory: apps/frontend/flutter-apps/fusion-launcher
      run: |
        flutter pub get
        cp /Users/devops/Documents/flutter-env/.env ./.env
        moon run flutter-apps:build-mac-ios-android
        # codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Release/Fusion\ Launcher.app/Contents/Frameworks/*
        # codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Release/Fusion\ Launcher.app/Contents/MacOS/Fusion\ Launcher*
        # codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Release/Fusion\ Launcher.app
        codesign -vvv -d --verbose ./build/macos/Build/Products/Release/Fusion\ Launcher.app
        hdiutil create -srcfolder "./build/macos/Build/Products/Release/Fusion Launcher.app" -volname "Fusion Launcher app" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW ./build/macos/Build/Products/Release/Fusion_Launcher.dmg
        hdiutil convert ./build/macos/Build/Products/Release/Fusion_Launcher.dmg -format UDZO -imagekey zlib-level=9 -ov -o ./build/macos/Build/Products/Release/Fusion_Launcher_installer.dmg
        xcrun --verbose notarytool submit ./build/macos/Build/Products/Release/Fusion_Launcher_installer.dmg --apple-id ${{ inputs.notarize_apple_id }} --password ${{ inputs.notarize_app_password }} --team-id "7FDK3RUF89" --wait
        xcrun --verbose stapler staple ./build/macos/Build/Products/Release/Fusion_Launcher_installer.dmg
        VERSION="${{ steps.get_version.outputs.version }}-${GITHUB_RUN_NUMBER}+$(git rev-parse --short=8 HEAD)"
        # curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/app/outputs/flutter-apk/app-release.apk ${{ inputs.nexus_url }}/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-apk/Fusion-Launcher-$VERSION.apk
        # curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/ios/ipa/Fusion\ Launcher.ipa ${{ inputs.nexus_url }}/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-iOS/Fusion-Launcher-$VERSION.ipa
        curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/macos/Build/Products/Release/Fusion_Launcher_installer.dmg ${{ inputs.nexus_url }}/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-macOS/Fusion-Launcher-$VERSION.dmg
        echo "Builds uploaded to Nexus successfully!"
        # echo "flutter-apk: https://nexus.dev.prod.bosepro.internal:8445/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-apk/Fusion-Launcher-$VERSION.apk"
        # echo "flutter-iOS: https://nexus.dev.prod.bosepro.internal:8445/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-iOS/Fusion-Launcher-$VERSION.ipa"
        echo "flutter-macOS: https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-macOS/Fusion-Launcher-$VERSION.dmg"
    - name: Flutter macOS Automation build
      if: >-
        ${{
          (
            github.event_name == 'push' &&
            (
              github.ref_name == 'develop' ||
              startsWith(github.ref_name, 'release/')
            )
          )
          ||
          (
            github.event_name == 'pull_request' &&
            (
              github.event.pull_request.base.ref == 'develop' ||
              startsWith(github.event.pull_request.base.ref, 'release/')
            )
          )
        }}
      shell: bash
      working-directory: apps/frontend/flutter-apps/fusion-launcher
      run: |
        flutter clean
        flutter pub get
        rm -rf windows/flutter/ephemeral
        rm -rf build/
        cp /Users/devops/Documents/flutter-env/.env ./.env
        moon run flutter-apps:macos-automation-build
        codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Profile/Fusion\ Launcher.app/Contents/Frameworks/*
        codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Profile/Fusion\ Launcher.app/Contents/MacOS/Fusion\ Launcher*
        codesign --force  --verbose=4 --display  --options runtime --entitlements macos/Runner/Release.entitlements --sign "Developer ID Application: Transom Post Opco LLC (7FDK3RUF89)" --identifier "com.bosepro.fusion" -vvv ./build/macos/Build/Products/Profile/Fusion\ Launcher.app
        codesign -vvv -d --verbose ./build/macos/Build/Products/Profile/Fusion\ Launcher.app
        hdiutil create -srcfolder "./build/macos/Build/Products/Profile/Fusion Launcher.app" -volname "Fusion Launcher app" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build.dmg
        hdiutil convert ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build.dmg -format UDZO -imagekey zlib-level=9 -ov -o ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build_installer.dmg
        xcrun --verbose notarytool submit ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build_installer.dmg --apple-id ${{ inputs.notarize_apple_id }} --password ${{ inputs.notarize_app_password }} --team-id "7FDK3RUF89" --wait
        xcrun --verbose stapler staple ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build_installer.dmg
        VERSION="${{ steps.get_version.outputs.version }}-${GITHUB_RUN_NUMBER}+$(git rev-parse --short=8 HEAD)"
        curl -k --ssl-no-revoke -f -u github-actions-uploader:${{ inputs.nexus_password }} -T ./build/macos/Build/Products/Profile/Fusion_Launcher_Automation_Build_installer.dmg ${{ inputs.nexus_url }}/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-macOS/Fusion-Launcher-Automation-Build-$VERSION.dmg
        echo "Builds uploaded to Nexus successfully!"
        echo "flutter-macOS-automation-build: https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}/$VERSION/flutter-macOS/Fusion-Launcher-Automation-Build-$VERSION.dmg"
