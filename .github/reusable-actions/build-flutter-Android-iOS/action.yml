name: "Build Flutter Android and iOS App"
description: "Build Flutter Android and iOS App"

runs:
  using: "composite"
  steps:
    - name: Read package version
      id: get_version
      uses: RCSandberg/dart-flutter-read-package-version-action@v2
      with:
        path: apps/frontend/flutter-apps/pubspec.yaml

    - name: Flutter Android build
      shell: bash
      working-directory: apps/frontend/flutter-apps
      run: |
        flutter pub get
        moon run fusion-launcher-prototype:build-apk
        VERSION="${{ steps.get_version.outputs.version }}-$(git rev-parse --short HEAD)"
        curl -k --ssl-no-revoke -f -u github-actions-uploader:test123 -T ./build/app/outputs/flutter-apk/app-release.apk https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/$VERSION/flutter-apk/aap-release-$VERSION.apk

    - name: Flutter iOS build
      shell: bash
      working-directory: apps/frontend/flutter-apps
      run: |
        flutter pub get
        security unlock-keychain -p "Sun@micro2." /Users/devops/Library/Keychains/login.keychain-db
        moon run fusion-launcher-prototype:build-iOS
        VERSION="${{ steps.get_version.outputs.version }}-$(git rev-parse --short HEAD)"
        curl -k --ssl-no-revoke -f -u github-actions-uploader:test123 -T ./build/ios/ipa/fusion_design_tool_prototype.ipa https://nexus.dev.prod.bosepro.internal:8445/repository/pro-fusion-local/Fusion-Frontend/Continuous/$VERSION/flutter-iOS/fusion_design_tool_prototype-$VERSION.ipa
