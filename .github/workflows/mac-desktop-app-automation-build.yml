name: Fusion-App-Mac-Automation-Build

# Only run on commits, not when tags added
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  flutter-mac-automation-build:
    concurrency:
      group: flutter-mac-automation-build
    runs-on: mac-agent-actions-runner
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-flutter-mac-automation
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          notarize_apple_id: ${{ secrets.NOTARIZE_APPLE_ID }}
          notarize_app_password: ${{ secrets.NOTARIZE_APP_PASSWORD }}
