name: Flutter Monorepo Build

on:
  workflow_dispatch:  

jobs:
  build:
    runs-on: android-mac-build-agent

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Proto Tool
      - name: Set up proto
        uses: moonrepo/setup-proto@v1

      # Install Moon via Proto
      - name: Install moon
        run: proto install moon

      # Install Toolchain
      - name: Run proto install
        run: proto install

      # Flutter pub cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # Run Flutter pub get and build for each package in monorepo
      - name: Build android apk
        working-directory: apps/frontend/fusion-launcher-prototype
        run: |
          flutter pub get
          moon run fusion-launcher-prototype:build-apk

      # Upload the APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fusion-launcher-apk
          path: apps/frontend/fusion-launcher-prototype/build/app/outputs/apk/release/*.apk
