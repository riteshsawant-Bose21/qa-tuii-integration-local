name: Fusion-Monorepo-Dev-CI

# Only run on commits, not when tags added
on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    branches:
      - develop
      - release/*

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  buildChecks:
    runs-on: mac-agent-actions-runner
    outputs:
      all: ${{ steps.filter.outputs.all }}
      fusionLauncher: ${{ steps.filter.outputs.fusionLauncher }}
      cloudServicesUI: ${{ steps.filter.outputs.cloudServicesUI }}
      cloudServicesBackend: ${{ steps.filter.outputs.cloudServicesBackend }}
      fusionDSP: ${{ steps.filter.outputs.fusionDSP }}
      fusionServer: ${{ steps.filter.outputs.fusionServer }}
      fusionSystemMonitor: ${{ steps.filter.outputs.fusionSystemMonitor }}
      fusionEdgeGateway: ${{ steps.filter.outputs.fusionEdgeGateway }}
      fusionTelemetryCore: ${{ steps.filter.outputs.fusionTelemetryCore }}
    

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          initial-fetch-depth: ''
          filters: |
            all:
              - "./*" # Any file at the root directory
              - "./.github/**"
              - "./apps/**"
            fusionLauncher:
              - "./apps/frontend/flutter-apps/**"
            cloudServicesUI:
              - "./apps/frontend/react-apps/**"
            cloudServicesBackend:
              - "./apps/cloud-backend/fusion-cloud/**"
            fusionDSP:
              - "./apps/firmware-apps/fusion-dsp/**"
            fusionServer:
              - "./apps/firmware-apps/fusion-server/**"
            fusionSystemMonitor:
              - "./apps/firmware-apps/fusion-system-monitor/**"
            fusionEdgeGateway:
              - "./apps/firmware-apps/fusion-edge-gateway/**"
            fusionTelemetryCore:
              - "./apps/firmware-apps/fusion-telemetry-core/**" 

  flutter-android-iOS-macOS-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionLauncher == 'true'
    concurrency:
      group: flutter-android-iOS-macOS-build
    runs-on: mac-agent-actions-runner
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-flutter-Android-iOS
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          notarize_apple_id: ${{ secrets.NOTARIZE_APPLE_ID }}
          notarize_app_password: ${{ secrets.NOTARIZE_APP_PASSWORD }}

  flutter-windows-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionLauncher == 'true'
    concurrency:
      group: flutter-windows-build
    runs-on: windows-actions-build-agent
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Build Apps
        uses: ./.github/reusable-actions/build-flutter-windows
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          cert_thumbprint: ${{ secrets.CERT_THUMBPRINT }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

  flutter-web-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionLauncher == 'true'
    concurrency:
      group: flutter-web-build
    runs-on: ubuntu-agent
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-flutter-web
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}

  cloud-servicesUI-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.cloudServicesUI == 'true'
    concurrency:
      group: cloud-servicesUI-build
    runs-on: ubuntu-agent
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-cloud-servicesUI

  cloud-web-backend-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.cloudServicesBackend == 'true'
    concurrency:
      group: cloud-web-backend-build
    runs-on: ubuntu-agent
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-cloud-web-backend
        with:
          cloud_backend_sonar_token: ${{ secrets.CLOUD_BACKEND_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}     

  fusion-dsp-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionDSP == 'true'
    concurrency:
      group: fusion-dsp-build
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      fusion_dsp_version: ${{ steps.build-fusion-dsp-CI.outputs.fusion_dsp_version }}
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        id: build-fusion-dsp-CI
        uses: ./.github/reusable-actions/build-fusion-dsp
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          jenkins_user_name: ${{ secrets.JENKINS_USER_NAME }}
          jenkins_user_token: ${{ secrets.JENKINS_TOKEN }}
          jenkins_url: ${{ secrets.JENKINS_URL }}
      
      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT

  fusion-server-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionServer == 'true'
    concurrency:
      group: fusion-server-build
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      fusion_server_version: ${{ steps.build-fusion-server-CI.outputs.fusion_server_version }}
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Fusion Server
        id: build-fusion-server-CI
        uses: ./.github/reusable-actions/build-fusion-server
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          jenkins_user_name: ${{ secrets.JENKINS_USER_NAME }}
          jenkins_user_token: ${{ secrets.JENKINS_TOKEN }}
          jenkins_url: ${{ secrets.JENKINS_URL }}

      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT

  fusion-system-monitor-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionSystemMonitor == 'true'
    concurrency:
      group: fusion-system-monitor-build
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      fusion_server_version: ${{ steps.build-fusion-system-monitor-CI.outputs.fusion_system_monitor_version }}
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        id: build-fusion-system-monitor-CI
        uses: ./.github/reusable-actions/build-fusion-system-monitor
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          jenkins_user_name: ${{ secrets.JENKINS_USER_NAME }}
          jenkins_user_token: ${{ secrets.JENKINS_TOKEN }}
          jenkins_url: ${{ secrets.JENKINS_URL }}

      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT
  
  fusion-edge-gateway-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionEdgeGateway == 'true'
    concurrency:
      group: fusion-edge-gateway-build
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      fusion_edge_gateway_version: ${{ steps.build-fusion-edge-gateway-CI.outputs.fusion_edge_gateway_version }}
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        id: build-fusion-edge-gateway-CI
        uses: ./.github/reusable-actions/build-fusion-edge-gateway
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          jenkins_user_name: ${{ secrets.JENKINS_USER_NAME }}
          jenkins_user_token: ${{ secrets.JENKINS_TOKEN }}
          jenkins_url: ${{ secrets.JENKINS_URL }}
      
      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT

  fusion-telemetry-core-build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionTelemetryCore == 'true'
    concurrency:
      group: fusion-telemetry-core-build
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      fusion_telemetry_core_version: ${{ steps.build-fusion-telemetry-core-CI.outputs.fusion_telemetry_core_version }}
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-fusion-telemetry-core
        with:
          flutter_apps_sonar_token: ${{ secrets.FLUTTER_APPS_SONAR_TOKEN }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_url: ${{ secrets.NEXUS_BASE_URL }}
          keychain_password: ${{ secrets.KEYCHAIN_PASSWORD }}
          jenkins_user_name: ${{ secrets.JENKINS_USER_NAME }}
          jenkins_user_token: ${{ secrets.JENKINS_TOKEN }}
          jenkins_url: ${{ secrets.JENKINS_URL }}
      
      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT

  integration-tests:
    needs:
      - flutter-android-iOS-macOS-build
      - flutter-windows-build
      - flutter-web-build
      - fusion-dsp-build
      - fusion-server-build
      - fusion-system-monitor-build
      - fusion-edge-gateway-build
      - fusion-telemetry-core-build

    if: |
      always() && (
        (needs.fusion-dsp-build.result == 'success' && needs.fusion-dsp-build.outputs.ran == 'true') ||
        (needs.fusion-server-build.result == 'success' && needs.fusion-server-build.outputs.ran == 'true') ||
        (needs.fusion-system-monitor-build.result == 'success' && needs.fusion-system-monitor-build.outputs.ran == 'true') ||
        (needs.fusion-edge-gateway-build.result == 'success' && needs.fusion-edge-gateway-build.outputs.ran == 'true') ||
        (needs.fusion-telemetry-core-build.result == 'success' && needs.fusion-telemetry-core-build.outputs.ran == 'true')
      )
    concurrency:
      group: integration-tests
    runs-on: ubuntu-agent
    outputs:
      ran: ${{ steps.set-output.outputs.ran }}
      MONOREPO_COMMIT_HASH: ${{ steps.hash-step.outputs.git-hash }}
    timeout-minutes: 30
    steps:
      - name: Make changes in target repo
        run: |
          echo "Integration Tests successful"
      - name: Set output
        id: set-output
        run: echo "ran=true" >> $GITHUB_OUTPUT
      - name: Generate Git hash
        id: hash-step
        run: |
          HASH=$(git rev-parse HEAD)
          echo "git-hash=$HASH" >> $GITHUB_OUTPUT

  yocto-image-build:
    needs:
      - integration-tests
      - fusion-server-build
      - fusion-system-monitor-build
      - fusion-edge-gateway-build
      - fusion-telemetry-core-build
      - fusion-dsp-build
    if: |
      always() && (
        needs.integration-tests.result == 'success' && needs.integration-tests.outputs.ran == 'true'
      )
    concurrency:
      group: yocto-image-build
    runs-on: ubuntu-agent
    timeout-minutes: 30
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: BoseProfessional/meta-fusion
          ref: develop
          token: ${{ secrets.META_FUSION_REPO_TOKEN }}
          fetch-depth: 0

      - name: Update fusion config file with branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          FILE="conf/fusion-mini_properties.inc"
          VERSION_INFO_FILE="recipes-bsp/fusion-init/fusion-init/fusion-mini/version_info.txt"
          MONOREPO_COMMIT_HASH=${{ needs.integration-tests.outputs.MONOREPO_COMMIT_HASH }}

          # Create file if it doesn't exist
          if [ ! -f "$FILE" ]; then
            echo "File $FILE does not exist. Failing the step."
            exit 1
          else
            # Replace the line or append it
            if grep -q "^FUSION_MONOREPO_BRANCH=" "$FILE"; then
              sed -i "s|^FUSION_MONOREPO_BRANCH=.*|FUSION_MONOREPO_BRANCH=\"${BRANCH_NAME}\"|" "$FILE"
            else
              echo "FUSION_MONOREPO_BRANCH=\"${BRANCH_NAME}\"" >> "$FILE"
            fi
            if grep -q "^FUSION_MONOREPO_COMMIT_HASH=" "$FILE"; then
              sed -i "s|^FUSION_MONOREPO_COMMIT_HASH=.*|FUSION_MONOREPO_COMMIT_HASH=\"${MONOREPO_COMMIT_HASH}\"|" "$FILE"
            else
              echo "FUSION_MONOREPO_COMMIT_HASH=\"${MONOREPO_COMMIT_HASH}\"" >> "$FILE"
            fi
            echo "FUSION_SERVER_VERSION=\"${{ needs.fusion-server-build.outputs.fusion_server_version }}\"" >> "$FILE"
          fi

          if [ ! -f "$VERSION_INFO_FILE" ]; then
            echo "File $VERSION_INFO_FILE does not exist. Failing the step."
            exit 1
          fi

          # --- FUSION_SERVER_VERSION ---
          if grep -q "^FUSION_SERVER_VERSION=" "$VERSION_INFO_FILE"; then
            sed -i "s|^FUSION_SERVER_VERSION=.*|FUSION_SERVER_VERSION=\"${{ needs.fusion-server-build.outputs.fusion_server_version }}\"|" "$VERSION_INFO_FILE"
          else
            echo "FUSION_SERVER_VERSION=\"${{ needs.fusion-server-build.outputs.fusion_server_version }}\"" >> "$VERSION_INFO_FILE"
          fi

          # --- FUSION_SYSTEM_MONITOR_VERSION ---
          if grep -q "^FUSION_SYSTEM_MONITOR_VERSION=" "$VERSION_INFO_FILE"; then
            sed -i "s|^FUSION_SYSTEM_MONITOR_VERSION=.*|FUSION_SYSTEM_MONITOR_VERSION=\"${{ needs.fusion-system-monitor-build.outputs.fusion_system_monitor_version }}\"|" "$VERSION_INFO_FILE"
          else
            echo "FUSION_SYSTEM_MONITOR_VERSION=\"${{ needs.fusion-system-monitor-build.outputs.fusion_system_monitor_version }}\"" >> "$VERSION_INFO_FILE"
          fi

          # --- FUSION_EDGE_GATEWAY_VERSION ---
          if grep -q "^FUSION_EDGE_GATEWAY_VERSION=" "$VERSION_INFO_FILE"; then
            sed -i "s|^FUSION_EDGE_GATEWAY_VERSION=.*|FUSION_EDGE_GATEWAY_VERSION=\"${{ needs.fusion-edge-gateway-build.outputs.fusion_edge_gateway_version }}\"|" "$VERSION_INFO_FILE"
          else
            echo "FUSION_EDGE_GATEWAY_VERSION=\"${{ needs.fusion-edge-gateway-build.outputs.fusion_edge_gateway_version }}\"" >> "$VERSION_INFO_FILE"
          fi

          # --- FUSION_TELEMETRY_CORE_VERSION ---
          if grep -q "^FUSION_TELEMETRY_CORE_VERSION=" "$VERSION_INFO_FILE"; then
            sed -i "s|^FUSION_TELEMETRY_CORE_VERSION=.*|FUSION_TELEMETRY_CORE_VERSION=\"${{ needs.fusion-telemetry-core-build.outputs.fusion_telemetry_core_version }}\"|" "$VERSION_INFO_FILE"
          else
            echo "FUSION_TELEMETRY_CORE_VERSION=\"${{ needs.fusion-telemetry-core-build.outputs.fusion_telemetry_core_version }}\"" >> "$VERSION_INFO_FILE"
          fi

          # --- FUSION_DSP_VERSION ---
          if grep -q "^FUSION_DSP_VERSION=" "$VERSION_INFO_FILE"; then
            sed -i "s|^FUSION_DSP_VERSION=.*|FUSION_DSP_VERSION=\"${{ needs.fusion-dsp-build.outputs.fusion_dsp_version }}\"|" "$VERSION_INFO_FILE"
          else
            echo "FUSION_DSP_VERSION=\"${{ needs.fusion-dsp-build.outputs.fusion_dsp_version }}\"" >> "$VERSION_INFO_FILE"
          fi
          git add conf/fusion-mini_properties.inc
          git add recipes-bsp/fusion-init/fusion-init/fusion-mini/version_info.txt
          git commit -m "CI: Build trigger from Fusion Monorepo branch: ${{ github.ref_name }}" || echo "No changes to commit"

      - name: Push commit to target repo
        run: |
          git push origin HEAD
