name: Fusion-Monorepo-Dev-CI

# Only run on commits, not when tags added
on:
  push:
    tags-ignore:
      - '**'
    branches:
      - '**'
  workflow_dispatch:  # Allow manual triggering of the workflow

permissions:
  actions: read
  contents: write

jobs:
  buildChecks:
    runs-on: android-mac-build-agent

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - "./*" # Any file at the root directory
              - "./.github/**"
              - "./apps/**"
            fusionLauncher:
              - "./apps/frontend/fusion-launcher-prototype/**"
            cloudServicesUI:
              - "./apps/frontend/cloud-services-ui/**"
            cloudServicesBackend:
              - "./apps/backend/fusion-cloud-backend/**"

  flutter-Android-iOS-Build:
    needs: buildChecks
    if: needs.buildChecks.outputs.fusionLauncher == 'true' && github.ref == 'refs/heads/main'
    concurrency:
      group: flutter-Android-iOS-Build
    runs-on: android-mac-build-agent
    timeout-minutes: 30

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      # This action sets up the toolchain for the monorepo
      # It installs the necessary dependencies and prepares the environment
      # for building and testing the monorepo packages.
      - name: Setup Monorepo Toolchain
        uses: ./.github/reusable-actions/setup-toolchain

      - name: Build Apps
        uses: ./.github/reusable-actions/build-flutter-Android-iOS
